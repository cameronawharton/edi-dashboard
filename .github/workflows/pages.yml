# Builds the installable app from the dashboard and publishes it to GitHub Pages on every push to main.
# Real records are never part of the build: the app reads them from Firebase (see firebase/config.public.js).
name: Publish app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: Build the dashboard page
        run: python3 dashboard/build.py
      - name: Install app build tools
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: firebase
      - name: Build the app
        run: node scripts/build.mjs
        working-directory: firebase
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: firebase/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
