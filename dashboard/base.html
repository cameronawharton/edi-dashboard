<title>Education Division Insight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left rail of views + working canvas; map view splits canvas into map and district panel. */
:root{
  --paper:#f3f4f1; --panel:#ffffff; --sunk:#e9ebe6; --ink:#1b2228; --ink2:#4c5761; --ink3:#77818a; --line:#d8dcd4;
  --accent:#24459c; --accent-soft:#e3e9f8; --on-accent:#ffffff;
  --ok:#2c7a4b; --ok-soft:#dcefe3; --due:#a8680f; --due-soft:#f6e8cf; --bad:#bf3229; --bad-soft:#f7dcd9;
  --off:#8b949b; --off-soft:#eceeeb; --un:#6f53a0; --un-soft:#ebe4f5;
  --land:#f4f5f1; --land-ours:#d7dccf; --outside:#e1e4de; --water:#e1e4de; --water-fill:#b4cddc; --water-ink:#4d7388;
  --road:#c8a48a; --shield:#5b6670; --county-line:#26323b; --ramp0:#eef1ea; --ramp1:#24459c; --isd-edge:#ffffff; --sel-fill:#e6ecfb; --hatch:#dcdfd7;
  --nfpa-b:#1f5fbf; --nfpa-r:#c8312a; --nfpa-y:#e9b90f; --nfpa-w:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px; --shadow:0 1px 2px rgb(20 30 40/.06),0 4px 16px rgb(20 30 40/.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111518; --panel:#192026; --sunk:#141a1f; --ink:#e6e9e4; --ink2:#aab3ba; --ink3:#7d8890; --line:#2a333a;
  --accent:#86a2f2; --accent-soft:#1f2a45; --on-accent:#0e1526;
  --ok:#5fc287; --ok-soft:#18301f; --due:#e3aa4f; --due-soft:#33270f; --bad:#f06a60; --bad-soft:#3a1714;
  --off:#6f7a82; --off-soft:#1f262b; --un:#b59be0; --un-soft:#2a2238;
  --land:#1c2329; --land-ours:#232c33; --outside:#101417; --water:#101417; --water-fill:#1b3442; --water-ink:#86adc3;
  --road:#6e5d50; --shield:#4b5660; --county-line:#c7cfd5; --ramp0:#242c33; --ramp1:#86a2f2; --isd-edge:#111518; --sel-fill:#1f2a45; --hatch:#2b343b; --nfpa-w:#e6e9e4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111518; --panel:#192026; --sunk:#141a1f; --ink:#e6e9e4; --ink2:#aab3ba; --ink3:#7d8890; --line:#2a333a;
  --accent:#86a2f2; --accent-soft:#1f2a45; --on-accent:#0e1526;
  --ok:#5fc287; --ok-soft:#18301f; --due:#e3aa4f; --due-soft:#33270f; --bad:#f06a60; --bad-soft:#3a1714;
  --off:#6f7a82; --off-soft:#1f262b; --un:#b59be0; --un-soft:#2a2238;
  --land:#1c2329; --land-ours:#232c33; --outside:#101417; --water:#101417; --water-fill:#1b3442; --water-ink:#86adc3;
  --road:#6e5d50; --shield:#4b5660; --county-line:#c7cfd5; --ramp0:#242c33; --ramp1:#86a2f2; --isd-edge:#111518; --sel-fill:#1f2a45; --hatch:#2b343b; --nfpa-w:#e6e9e4;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}

/* Shell */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding-block:16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center}
.brand b{font:700 18px/1.02 var(--f-display);letter-spacing:.02em;text-transform:uppercase;display:block;text-wrap:balance}
.brand small{color:var(--ink3);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.badge{width:50px;height:auto;flex:none;filter:drop-shadow(0 1px 1px rgb(0 0 0/.25))}
@media (max-width:760px){.badge{width:38px}}
nav.views{display:flex;flex-direction:column;gap:2px}
nav.views a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:var(--r);color:var(--ink2);text-decoration:none;font-weight:500}
nav.views a:hover{background:var(--sunk);color:var(--ink)}
nav.views a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav.views a .ct{font:600 12px var(--f-mono);color:var(--ink3)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--ink3);display:flex;flex-direction:column;gap:6px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.topbar h1{font:700 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
.topbar .sp{flex:1}
.yearpick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.rot-chip{font:700 13px var(--f-display);letter-spacing:.06em;background:var(--ink);color:var(--paper);padding:3px 8px;border-radius:4px}
.content{padding-block:20px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;min-width:0}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
textarea{width:100%;min-height:72px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);margin-left:5px;opacity:.75}

/* Type */
h2{font:600 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font:600 15px/1.2 var(--f-body);margin:0}
.eyebrow{font:600 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.sechead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sechead .sp{flex:1}

/* State pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-done{color:var(--ok);background:var(--ok-soft)} .s-failed{color:var(--bad);background:var(--bad-soft)}
.s-due{color:var(--due);background:var(--due-soft)} .s-off{color:var(--off);background:var(--off-soft)}
.s-unassigned{color:var(--un);background:var(--un-soft)} .s-excluded{color:var(--off);background:transparent;border:1px dashed var(--line)}
.tag{font:500 11px var(--f-mono);padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.rot{font:700 13px var(--f-display);width:22px;height:22px;display:inline-grid;place-items:center;border-radius:4px;border:1px solid var(--line);color:var(--ink2)}
.rot.cur{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* Program tiles */
.programs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.prog{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;min-width:0;cursor:pointer;text-align:left}
.prog:hover{border-color:var(--ink3)}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog .big{font:700 44px/0.9 var(--f-display);font-variant-numeric:tabular-nums}
.prog .big small{font-size:20px;color:var(--ink3);margin-left:2px}
.prog .sub{font-size:12.5px;color:var(--ink2)}
.meter{position:relative;height:10px;background:var(--sunk);border-radius:3px;overflow:visible}
.meter > i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.meter .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.meter .pace{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dotted var(--ink3)}
.meter.thin{height:7px}
.legend-line{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3)}
.legend-line span{display:inline-flex;align-items:center;gap:5px}
.legend-line .k-t{width:2px;height:11px;background:var(--ink)} .legend-line .k-p{width:0;height:11px;border-left:2px dotted var(--ink3)}

/* Panels & tables */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel > .ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel > .pb{padding:14px 16px}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--sunk)}
table.t td.r,table.t th.r{text-align:right}
.cov{display:grid;grid-template-columns:120px 46px;gap:8px;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.attn{display:flex;flex-direction:column}
.attn .row{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}
.attn .row:last-child{border-bottom:0}
.attn .sev{width:4px;align-self:stretch;border-radius:2px;flex:none}
.attn .grow{flex:1;min-width:0}
.empty{padding:28px 16px;text-align:center;color:var(--ink3)}
.skeleton{color:var(--ink3);padding:40px 20px;text-align:center;border:1px dashed var(--line);border-radius:8px}

/* Directory */
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;text-align:left}
.card:hover{border-color:var(--ink3)}
.card .nm{font-weight:600;overflow-wrap:anywhere}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink2)}

/* Org header */
.orghead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.orghead .stat{display:flex;flex-direction:column;gap:2px;min-width:90px}
.orghead .stat b{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.contacts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.contact{border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:12.5px;min-width:0}
.contact .role{color:var(--ink3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.contact .email{overflow-wrap:anywhere}

/* Map: full-height stage; county basemap with districts as the interactive layer; briefing panel on the right. */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);height:calc(100vh - 140px);min-height:560px}
.mapbox{position:relative;background:var(--water);min-width:0;overflow:hidden;touch-action:none}
.mapbox svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
.mapbox svg.drag{cursor:grabbing}
.mapbox svg.placing{cursor:crosshair}
.g-county{fill:var(--land)}
.g-countyline{fill:none;stroke:var(--county-line);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none}
.g-outside{fill:none;stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;opacity:.45;pointer-events:none}
.g-ctx{fill:url(#hatch);stroke:var(--line);stroke-width:.8;vector-effect:non-scaling-stroke;pointer-events:none}
.g-water{fill:var(--water-fill);pointer-events:none}
.g-road{fill:none;stroke:var(--road);stroke-width:1.1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;opacity:.85}
.g-road.loop{stroke-width:1.5}
.isd{stroke:var(--isd-edge);stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .25s,fill .4s}
.isd:focus{outline:none}
.isd:focus-visible{stroke:var(--accent);stroke-width:2.5}
.isd.dim{opacity:.38}
.isd.sel{stroke:var(--accent);stroke-width:2.6}
.lift{pointer-events:none;stroke:var(--panel);stroke-width:2.2;vector-effect:non-scaling-stroke;filter:url(#liftShadow);transition:transform .18s ease-out}
.lift-edge{pointer-events:none;fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke}
.mchip{pointer-events:none}
.mchip rect{fill:var(--panel);stroke:var(--line);vector-effect:non-scaling-stroke}
.mchip .nm{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;fill:var(--ink)}
.mchip .pc{font-family:var(--f-mono);font-weight:500;fill:var(--ink2)}
.mchip.dim{opacity:.45}
.mchip .flag{fill:var(--bad)}
.ctxlab{font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;fill:var(--ink3);text-anchor:middle;pointer-events:none}
.wlab{font-family:var(--f-body);font-style:italic;fill:var(--water-ink);text-anchor:middle;pointer-events:none}
.shield rect{fill:var(--shield);stroke:var(--panel);vector-effect:non-scaling-stroke}
.shield text{font-family:var(--f-display);font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central}
.pin{stroke:var(--panel);vector-effect:non-scaling-stroke;stroke-width:1.4;cursor:pointer}
.pin.hot{stroke:var(--ink);stroke-width:2.4}
.mapctl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.mapctl .btn{width:34px;height:34px;justify-content:center;padding:0;font-size:17px;box-shadow:var(--shadow)}
.maptools{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 80px)}
.maplayers{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);font-size:12.5px}
.maplayers label{display:flex;gap:7px;align-items:center;cursor:pointer}
.maplayers summary{cursor:pointer;list-style-position:inside}
@media (max-width:760px){.legend .row,.legend .scale{display:none}.legend .ramp{width:120px}.hovercard{display:none}}
.legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--ink2);box-shadow:var(--shadow);max-width:calc(100% - 28px)}
.legend .ramp{height:8px;width:200px;max-width:100%;border-radius:2px;background:linear-gradient(90deg,var(--ramp0),var(--ramp1))}
.legend .scale{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);width:200px;max-width:100%}
.legend .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.legend .row span{display:inline-flex;gap:5px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.sqd{width:9px;height:9px;display:inline-block;transform:rotate(45deg)}
.hatchkey{width:14px;height:10px;display:inline-block;border:1px solid var(--line);background:repeating-linear-gradient(45deg,var(--land),var(--land) 2px,var(--line) 2px,var(--line) 3px)}
.placing-banner{position:absolute;left:50%;transform:translateX(-50%);top:14px;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-weight:500;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);z-index:4}
.hovercard{position:absolute;z-index:3;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgb(10 20 30/.18);padding:12px 16px 12px 12px;display:grid;grid-template-columns:auto 1fr;gap:3px 14px;align-items:center;width:300px;transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .15s}
.hovercard.on{opacity:1}
.hovercard .ring{grid-row:1/4}
.hovercard .t{font:700 18px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hovercard .s{font-size:12px;color:var(--ink2)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--sunk)}
.ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring .tk{stroke:var(--ink);stroke-width:2}
.ring text{font-family:var(--f-display);font-weight:700;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.tooltip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:5px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-130%);z-index:3}
/* Briefing panel */
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel)}
.side .scroll{overflow-y:auto;flex:1;min-height:0}
.bhead{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;position:sticky;top:0;background:var(--panel);z-index:2}
.bhead .top{display:flex;gap:8px;align-items:center}
.bhead h2{font-size:26px;line-height:1}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.hero .facts div{display:flex;flex-direction:column}
.hero .facts b{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hero .facts span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.bsec{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.bsec:last-child{border-bottom:0}
.bsec h3{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.stack{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.stackkey{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.stackkey span{display:inline-flex;gap:5px;align-items:center}
.issue{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.issue .bar{width:3px;align-self:stretch;border-radius:2px;flex:none}
.issue b{font-weight:600}
.ccard{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12.5px}
.ccard .role{grid-column:1/-1;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.ccard .nm{font-weight:600}
.ccard .ln{display:flex;gap:6px;align-items:center;grid-column:1/-1;min-width:0}
.ccard .ln span{overflow-wrap:anywhere}
.copy{border:0;background:none;color:var(--accent);cursor:pointer;font-size:11.5px;padding:0 2px}
.fgroup{display:flex;flex-direction:column}
.fgroup .gh{font-size:12px;font-weight:600;color:var(--ink2);padding:6px 0;display:flex;gap:6px;align-items:center}
.frow{display:flex;gap:9px;align-items:center;padding:7px 8px;margin:0 -8px;border-radius:6px;cursor:pointer;font-size:13px}
.frow:hover,.frow.hot{background:var(--sunk)}
.frow .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .when{font-family:var(--f-mono);font-size:11.5px;color:var(--ink3)}
.rank{display:flex;flex-direction:column}
.rank .r{display:grid;grid-template-columns:22px minmax(0,1fr) 92px 44px;gap:10px;align-items:center;padding:8px 18px;cursor:pointer;font-size:13px}
.rank .r:hover,.rank .r.hot{background:var(--sunk)}
.rank .r .i{font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.rank .r .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.fitem{display:flex;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.fitem:hover,.fitem.hot{background:var(--sunk)}
.fitem .grow{flex:1;min-width:0}
.fitem .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Explorer: filter column + results */
.explorer{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.exf{background:var(--panel);border:1px solid var(--line);border-radius:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);max-height:calc(100vh - 92px);overflow-y:auto}
.exf summary{padding:12px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);list-style:none}
.exf summary::-webkit-details-marker{display:none}
.exfb{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.exfb input[type=search]{width:100%}
.fset{display:flex;flex-direction:column;gap:7px}
.fset .chips{gap:5px}
.chip[disabled]{opacity:.4;cursor:default}
.chip.on-tag{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pintoggle{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.pintoggle .n{margin-left:auto;color:var(--ink3)}
.olist{display:flex;flex-direction:column;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:6px}
.orow{display:grid;grid-template-columns:22px minmax(0,1fr) auto 30px;gap:6px;align-items:center;padding:4px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
.orow:last-child{border-bottom:0}
.orow.on{background:var(--accent-soft)}
.orow label{display:flex;gap:6px;align-items:center;cursor:pointer;min-width:0}
.orow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .n{text-align:right;color:var(--ink3)}
.pin-star{border:0;background:none;cursor:pointer;color:var(--ink3);font-size:15px;line-height:1;padding:2px;border-radius:4px}
.pin-star:hover{color:var(--due);background:var(--sunk)}
.pin-star.on{color:var(--due)}
.pin-star.via{color:color-mix(in srgb,var(--due) 45%,transparent)}
.exm{display:flex;flex-direction:column;gap:12px;min-width:0}
.exsum{display:flex;flex-direction:column;gap:12px}
.exnums{display:flex;gap:26px;flex-wrap:wrap}
.exnums div{display:flex;flex-direction:column}
.exnums b{font:700 28px/1 var(--f-display)}
.exnums span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.exctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.exctl label{display:flex;gap:6px;align-items:center}
table.ext tr.grp td{background:var(--sunk);padding:8px 12px}
.grph{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grph .gmeter{width:120px}
.pincell{width:30px;padding-right:0!important}
.rot.wide{width:auto;padding:0 6px;font:600 11px var(--f-body);letter-spacing:.02em;white-space:nowrap}
/* Insights */
.insgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.qcard.wide{grid-column:1/-1}
.qcard .q{font:600 18px/1.45 var(--f-body);text-wrap:balance}
.inl{font:600 15px var(--f-body);padding:2px 6px;border:0;border-bottom:2px solid var(--accent);border-radius:0;background:var(--accent-soft);color:var(--accent);margin:0 2px}
input.inl{width:64px;text-align:center}
.ans{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.ans b{font:700 46px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ans .of{font-size:22px;color:var(--ink3);font-weight:600}
.ans .big2{font:600 22px/1 var(--f-display);color:var(--ink2)}
.ans.warn b{font-size:28px;color:var(--due)}
.delta{font:600 13px var(--f-mono);padding:2px 8px;border-radius:999px}
.delta.up{background:var(--ok-soft);color:var(--ok)} .delta.down{background:var(--bad-soft);color:var(--bad)}
.sentence{border-left:3px solid var(--accent);background:var(--sunk);padding:9px 12px;border-radius:0 6px 6px 0;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.sentence span{flex:1}
.qlist{display:flex;flex-direction:column;max-height:260px;overflow-y:auto;border-top:1px solid var(--line)}
.qrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(80px,1fr) auto auto;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.qrow:hover{background:var(--sunk)}
.qrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.method{margin:0;font-size:12px;color:var(--ink3)}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.strip div{display:flex;flex-direction:column;gap:3px}
.strip b{font:700 32px/1 var(--f-display)}
.chartwrap{display:flex;flex-direction:column;gap:6px}
.orgfilter{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Team */
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

.bars{display:flex;gap:3px;align-items:flex-end;height:46px}
.bars i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px;opacity:.85}
.bars i.zero{background:var(--line)}
.barlabels{display:flex;gap:3px;font:500 9.5px var(--f-mono);color:var(--ink3)}

/* Data */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--ink2);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.finding{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.finding:last-child{border-bottom:0}

.finding p{margin:4px 0 0;color:var(--ink2);font-size:13px;overflow-wrap:anywhere}
pre.code{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px;overflow-x:auto;font:12px/1.5 var(--f-mono);margin:0}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}

.combo{position:relative}

.combo .opt{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.combo .opt:hover,.combo .opt.on{background:var(--sunk)}
.sel-fac{display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.hist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px}
.hist .h{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:6px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.notice{border:1px solid var(--line);border-left:4px solid var(--due);background:var(--panel);border-radius:6px;padding:10px 14px;font-size:13px}

<script>
"use strict";
/* ------------------------------------------------------------------ geography (Census TIGER school districts, county, roads and water; clipped to Harris County) */
const GEO = __GEO__;
const POLY_FOR_ORG = Object.fromEntries(Object.keys(GEO.isd).map(k=>[k,k]));
const KX = Math.cos(29.85*Math.PI/180);
const proj = (lng,lat)=>[ (lng+96)*1000*KX, (30.45-lat)*1000 ];
const unproj = (x,y)=>[ x/(1000*KX)-96, 30.45 - y/1000 ];

/* ------------------------------------------------------------------ state */
const S = {
  db:null, user:null, downloads:null, ready:false, offline:false,
  orgs:{}, ledgers:{}, projects:{}, team:{}, inbox:{}, settings:null, audit:null,
  loaded:{orgs:false,ledgers:false}, me:{id:null,name:""}, canWrite:true, profiles:{},
  ui:{year:null, view:"overview", param:null, map:{vb:null, sel:null, layers:{isd:true,sites:false,roads:true,closed:false}, filter:"rotation", placing:null, hot:null},
      fac:{q:"",state:"attention",type:"all"}, ex:null, orgrot:"all",
      ins:{q1type:"ISD",q1thr:50,q1year:null,q2type:"ISD",q2kind:"any",q2months:12,q3year:null,q4year:null,q5year:null,q6year:null}, team:{period:"year"}, data:{tab:"audit"}, dir:{q:""}}
};
S.pins={orgs:{},facs:{}};
try{ const saved=JSON.parse(localStorage.getItem("hcfmo-ui")||"{}"); if(saved.layers) Object.assign(S.ui.map.layers,saved.layers); if(saved.ex) S.ui.ex=saved.ex; const pins=JSON.parse(localStorage.getItem("hcfmo-pins")||"null"); if(pins) S.pins=pins; }catch(e){}
const persistUI=()=>{ try{ localStorage.setItem("hcfmo-ui",JSON.stringify({layers:S.ui.map.layers,ex:S.ui.ex})); }catch(e){} };

/* ------------------------------------------------------------------ helpers */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=(x,d=0)=>isFinite(x)?(x*100).toFixed(d)+"%":"–";
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
const fmtDate=iso=>{ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${+m}/${+d}/${y.slice(2)}`; };
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const TYPE_LABEL={ISD:"Public ISDs",Charter:"Charter schools",Private:"Private schools",Daycare:"ISD daycares"};
const TYPE_SHORT={ISD:"ISD",Charter:"Charter",Private:"Private",Daycare:"Daycare"};
const STATE_LABEL={done:"Inspected",failed:"Failed · re-inspect",due:"Due this year",off:"Off-cycle",unassigned:"No rotation",excluded:"Excluded"};
const STATUS_LABEL={active:"Active",closed:"Closed",construction:"Under construction",hold:"On hold",inactive:"Not in use",removed:"Removed"};
const RESULT_LABEL={pass:"Pass",fail:"Fail",partial:"Partial",unknown:"Recorded"};
const PHASES=["Pre-submittal","Plan review","Under construction","Final inspection","Complete"];
const TEAM_COLORS=["#24459c","#2c7a4b","#a8680f","#bf3229","#6f53a0","#1b7f8c","#8a5a2b","#4c5761"];

function settings(){ return Object.assign({yearStartMonth:8,workEndMonth:5,rotationAnchor:{year:"2025-26",letter:"A"},targets:{ISD:.30,Charter:1,Private:1,Daycare:1}}, S.settings||{}); }
function yearOf(iso){ const y=+iso.slice(0,4), m=+iso.slice(5,7), sm=settings().yearStartMonth; const s=m>=sm?y:y-1; return `${s}-${String(s+1).slice(2)}`; }
function curYear(){ return S.ui.year || yearOf(todayISO()); }
function rotationFor(year){ const a=settings().rotationAnchor; const diff=+year.slice(0,4)-+a.year.slice(0,4); const L="ABC"; return L[(((L.indexOf(a.letter)+diff)%3)+3)%3]; }
function yearBounds(year){ const s=+year.slice(0,4), sm=settings().yearStartMonth, em=settings().workEndMonth; const pad=n=>String(n).padStart(2,"0");
  return {start:`${s}-${pad(sm)}-01`, workEnd:`${s+1}-${pad(em)}-${em===2?28:[4,6,9,11].includes(em)?30:31}`, end:`${s+1}-${pad(sm===1?12:sm-1)}-${[4,6,9,11].includes(sm-1)?30:31}`}; }
function paceFrac(year){ const b=yearBounds(year), t=todayISO(); if(t<=b.start) return 0; if(t>=b.workEnd) return 1;
  return (Date.parse(t)-Date.parse(b.start))/(Date.parse(b.workEnd)-Date.parse(b.start)); }
function target(org){ return org.target ?? settings().targets[org.type] ?? 1; }
function allYears(){ const ys=new Set([curYear(), yearOf(todayISO())]); Object.values(S.ledgers).forEach(l=>ys.add(l.year)); const n=yearOf(todayISO()); const s=+n.slice(0,4)+1; ys.add(`${s}-${String(s+1).slice(2)}`); return [...ys].sort().reverse(); }

/* ------------------------------------------------------------------ derived model */
const MODELS={};
function model(Yarg){
  const Y=Yarg||curYear(), L=rotationFor(Y), key=Y+"|"+S._rev;
  if(MODELS[Y] && MODELS[Y].key===key) return MODELS[Y].m;
  const live=yearOf(todayISO());
  const facs=[], byId={};
  for(const [oid,o] of Object.entries(S.orgs)){
    for(const [fid,f] of Object.entries(o.facilities||{})){
      if(!f || f.status==="removed") continue;
      if(f.since && f.since>Y) continue;
      const r=Object.assign({id:fid, orgId:oid, org:o, type:o.type, visitsAll:[], visitsY:[]}, f);
      facs.push(r); byId[fid]=r;
    }
  }
  const visits=[];
  for(const [lid,l] of Object.entries(S.ledgers)){
    for(const [vid,v] of Object.entries(l.visits||{})){
      if(!v) continue;
      const rec=Object.assign({id:vid, ledger:lid, orgId:l.org, year:l.year}, v);
      visits.push(rec);
      const f=byId[v.facility]; if(!f) continue;
      f.visitsAll.push(rec); if(l.year===Y && !v.voided) f.visitsY.push(rec);
    }
  }
  for(const f of facs){
    f.visitsAll.sort((a,b)=>b.date.localeCompare(a.date)); f.visitsY.sort((a,b)=>a.date.localeCompare(b.date));
    const excluded=f.status && f.status!=="active" && !(Y<live && f.visitsY.length);
    const required = f.type!=="ISD" ? true : (f.rotation===L || f.rotation==="ABC" || (f.flags||[]).includes("walk-every-year"));
    f.inRotation = !excluded && required;
    if(excluded) f.state="excluded";
    else if(f.visitsY.length){ const last=f.visitsY[f.visitsY.length-1]; const anyPassAfterFail = last.result!=="fail"; f.state = anyPassAfterFail ? "done" : "failed"; f.lastY=last; }
    else if(f.type==="ISD" && !f.rotation) f.state="unassigned";
    else f.state = required ? "due" : "off";
    f.visited = f.visitsY.length>0;
    f.lastAny = f.visitsAll.find(v=>!v.voided);
  }
  const orgStats={};
  const pf=paceFrac(Y);
  for(const [oid,o] of Object.entries(S.orgs)){
    const fs=facs.filter(f=>f.orgId===oid);
    const act=fs.filter(f=>f.state!=="excluded");
    const st={org:o, id:oid, total:fs.length, active:act.length, visited:act.filter(f=>f.visited).length, failed:act.filter(f=>f.state==="failed").length,
      due:act.filter(f=>f.state==="due").length, rotTotal:act.filter(f=>f.inRotation).length, rotDone:act.filter(f=>f.inRotation&&f.visited).length,
      unassigned:act.filter(f=>f.state==="unassigned").length, excluded:fs.length-act.length, target:target(o)};
    st.coverage = st.active? st.visited/st.active : 0;
    st.need = Math.max(0, Math.ceil(st.target*st.active - 1e-9) - st.visited);
    st.expected = st.target*pf;
    st.behind = st.active>0 && st.coverage + 1e-9 < st.expected - (o.type==="ISD"?0.05:0.10);
    st.met = st.active>0 && st.coverage+1e-9>=st.target;
    orgStats[oid]=st;
  }
  const prog={};
  for(const t of ["ISD","Charter","Private","Daycare"]){
    const os=Object.values(orgStats).filter(s=>s.org.type===t && s.active>0);
    const a=os.reduce((s,x)=>s+x.active,0), v=os.reduce((s,x)=>s+x.visited,0);
    prog[t]={type:t, orgs:os.length, active:a, visited:v, coverage:a?v/a:0, target:settings().targets[t], met:os.filter(o=>o.met).length,
      failed:os.reduce((s,x)=>s+x.failed,0), need:os.reduce((s,x)=>s+x.need,0), behind:os.filter(o=>o.behind).length, rotTotal:os.reduce((s,x)=>s+x.rotTotal,0), rotDone:os.reduce((s,x)=>s+x.rotDone,0)};
  }
  const m={Y,L,facs,byId,visits,orgStats,prog,pf};
  MODELS[Y]={key,m}; return m;
}

const flash=(msg)=>{ const r=$("#toastroot"); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(flash.t); flash.t=setTimeout(()=>{r.innerHTML="";},3200); };
async function write(fn, okMsg){
  if(!S.db){ flash("Saving needs the shared database. Open this page in Claude while signed in."); return false; }
  try{ await fn(); if(okMsg) flash(okMsg); return true; }
  catch(e){
    if(e && e.code==="invalid_argument" && S.canWrite===true && S._writeProbe!==false){ /* may be a missing doc; caller handles */ throw e; }
    flash(e && e.code==="quota_exceeded" ? "The database is full. Ask Claude to archive old records." : "That change did not save ("+(e&&e.code||"error")+"). Try again.");
    return false;
  }
}
async function upsertLedger(orgId, year, vid, rec){
  const id=`${orgId}__${year}`, ref=S.db.doc("ledgers/"+id);
  if(S.ledgers[id]){ await ref.update({visits:{[vid]:rec}}); return; }
  try{ await ref.update({visits:{[vid]:rec}}); }
  catch(e){ if(e && e.code==="invalid_argument") await ref.set({org:orgId, year, visits:{[vid]:rec}}); else throw e; }
}
async function saveVisits(list){ // list of {orgId, year, vid, rec}
  const groups={};
  list.forEach(x=>{ const k=x.orgId+"__"+x.year; (groups[k]=groups[k]||{orgId:x.orgId,year:x.year,visits:{}}).visits[x.vid]=x.rec; });
  for(const g of Object.values(groups)){
    const id=`${g.orgId}__${g.year}`, ref=S.db.doc("ledgers/"+id);
    if(S.ledgers[id]) await ref.update({visits:g.visits});
    else { try{ await ref.update({visits:g.visits}); }catch(e){ if(e&&e.code==="invalid_argument") await ref.set({org:g.orgId,year:g.year,visits:g.visits}); else throw e; } }
  }
}

let renderQueued=false;
function scheduleRender(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{renderQueued=false; render();}); }
async function boot(){
  routeFromHash(); render();
  if(!window.claude || !window.claude.use){ S.offline=true; render(); return; }
  const [db,user,downloads]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]);
  S.db=db; S.user=user; S.downloads=downloads;
  if(!db){ S.offline=true; render(); return; }
  if(user){ try{ const me=await user.me(); S.me={id:me.id,name:me.name||""}; const cw=await user.can("data.write"); if(cw===false) S.canWrite=false; }catch(e){} }
  const sub=(col,key,flag)=>db.collection(col).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>{o[d.id]=d.data();}); S[key]=o; if(flag) S.loaded[flag]=true; bump(); scheduleRender(); }, err=>{ console.warn(col,err); });
  if(S.me.id){ try{ db.doc(`data/users/${S.me.id}/pins`).onSnapshot(d=>{ if(d.exists){ const x=d.data(); S.pins={orgs:Object.fromEntries((x.orgs||[]).map(k=>[k,1])),facs:Object.fromEntries((x.facs||[]).map(k=>[k,1]))}; scheduleRender(); } },()=>{}); }catch(e){} }
  sub("orgs","orgs","orgs"); sub("ledgers","ledgers","ledgers"); sub("projects","projects"); sub("team","team"); sub("inbox","inbox");
  db.collection("config").onSnapshot(snap=>{ snap.docs.forEach(d=>{ if(d.id==="settings") S.settings=d.data(); if(d.id==="audit") S.audit=d.data(); }); bump(); scheduleRender(); });
  S.ready=true; render();
}

      <p class="method">Counts districts with at least one project whose start date falls in the window. Only projects logged under Active projects are counted.</p></section>`); }
  /* Q3: workload */
  { const Y=I.q3year||cur, P=prevYear(Y); const vs=y=>Object.values(S.ledgers).filter(l=>l.year===y).flatMap(l=>Object.values(l.visits||{})).filter(v=>v&&!v.voided);

      <p class="method">Every logged visit counts once, including re-inspections. Voided visits are left out. Visits from the spreadsheets keep their original dates.</p></section>`); }
  /* Q4: failures cleared */
  { const Y=I.q4year||cur; const M=model(Y); const fails=[]; const cleared=[];
    for(const f of M.facs){ const vs=f.visitsAll.filter(v=>!v.voided).slice().sort((x,y)=>x.date.localeCompare(y.date)); vs.forEach((v,i)=>{ if(v.year!==Y||v.result!=="fail") return; fails.push(f); const nx=vs.slice(i+1).find(w=>w.result!=="fail"); if(nx) cleared.push({f,d:days(v.date,nx.date)}); }); }
    const open=M.facs.filter(f=>f.state==="failed"); const med=median(cleared.map(c=>c.d));

    const M=model(Y); const seen=new Set(); Object.values(S.ledgers).filter(l=>win.includes(l.year)).forEach(l=>Object.values(l.visits||{}).forEach(v=>{ if(v&&!v.voided) seen.add(v.facility); }));

function reportText(M){
  const P=M.prog; const lines=[`HCFMO Prevention Bureau · Education Division Insight · School inspection status · ${M.Y} (rotation ${M.L}) · as of ${fmtDate(todayISO())}`,""];
  ["ISD","Charter","Private","Daycare"].forEach(t=>lines.push(`${TYPE_LABEL[t]}: ${P[t].visited} of ${P[t].active} inspected (${pct(P[t].coverage)}; target ${pct(P[t].target)})${P[t].failed?`, ${P[t].failed} failed awaiting re-inspection`:""}`));
  lines.push("", "ISDs below target:");
  Object.values(M.orgStats).filter(s=>s.org.type==="ISD"&&!s.met&&s.active).sort((a,b)=>a.coverage-b.coverage).forEach(s=>lines.push(`  ${s.org.name}: ${pct(s.coverage)} (${s.need} more needed)`));
  lines.push("", `Visits logged this season: ${M.visits.filter(v=>v.year===M.Y&&!v.voided).length}`);
  return lines.join("\n");
}

function parseCSV(text){ const rows=[]; let row=[], cur="", q=false; for(let i=0;i<text.length;i++){ const c=text[i];
  if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
  else if(c==='"') q=true; else if(c===","||c==="\t"&&!text.includes(",")){ row.push(cur); cur=""; } else if(c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(cur); rows.push(row); row=[]; cur=""; } else cur+=c; }
  if(cur||row.length){ row.push(cur); rows.push(row); } return rows.filter(r=>r.some(x=>x.trim())); }
const IMP_FIELDS=[["facility","Facility / school name",true],["org","District or operator",false],["date","Date inspected",true],["kind","Visit type",false],["result","Result",false],["coi","COI #",false],["inspector","Inspector",false],["notes","Notes",false]];
function guessCol(h){ const x=h.toLowerCase(); if(/school|facility|campus|daycare name|name/.test(x)&&!/inspector|district/.test(x)) return "facility"; if(/district|isd|operator|org/.test(x)) return "org"; if(/re-?insp/.test(x)) return null; if(/date/.test(x)) return "date"; if(/type|kind/.test(x)) return "kind"; if(/result|status|pass|fail/.test(x)) return "result"; if(/coi|cert/.test(x)) return "coi"; if(/inspector|officer|by/.test(x)) return "inspector"; if(/note|comment/.test(x)) return "notes"; return null; }
const tokens=s=>new Set(String(s).toLowerCase().replace(/&/g," and ").replace(/\(.*?\)/g," ").replace(/[^a-z0-9 ]/g," ").replace(/\belementary\b/g,"elem").replace(/\bmiddle( school)?\b/g,"ms").replace(/\bhigh( school)?\b/g,"hs").replace(/\bintermediate\b/g,"int").replace(/\bjunior high\b/g,"jh").replace(/\b(school|the|of|and|isd|campus)\b/g," ").split(/\s+/).filter(Boolean));
function matchFacility(M,name,orgName){
  const nt=tokens(name), ot=orgName?tokens(orgName):null; let best=null, bs=0;
  for(const f of M.facs){ const ft=tokens(f.name); let inter=0; nt.forEach(t=>{if(ft.has(t)) inter++;}); if(!inter) continue;
    let s=inter/new Set([...nt,...ft]).size; if(ot){ const og=tokens(f.org.name); let oi=0; ot.forEach(t=>{if(og.has(t)) oi++;}); if(oi) s+=.25; else s-=.2; }
    if(s>bs){bs=s;best=f;} }

}
function normDate(s){ s=String(s||"").trim(); let m; if((m=s.match(/^(\d{4})-(\d\d)-(\d\d)/))) return m[0]; if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[1].padStart(2,"0")}-${m[2].padStart(2,"0")}`; } return null; }
function normResult(s){ s=String(s||"").toLowerCase(); if(/fail/.test(s)) return "fail"; if(/pass|walk|ok|complete/.test(s)||/^20\d\d-\d+/.test(s)) return "pass"; if(/partial/.test(s)) return "partial"; return "unknown"; }
function normKind(s){ s=String(s||"").toLowerCase(); return /re-?insp/.test(s)?(/2/.test(s)?"reinspection 2":"reinspection"):"initial"; }
function teamIdFor(name){ if(!name) return null; const n=String(name).toLowerCase(); const e=Object.entries(S.team).find(([id,t])=>t.name.toLowerCase()===n||id===n||t.name.toLowerCase().split(" ").pop()===n.split(" ").pop()); return e?e[0]:null; }

function fullExtent(){ return GEO.bbox.slice(); }
function fitOrg(oid){ const L=GEO.labels[oid]; if(!L) return fullExtent(); const [x,y,w,h]=L.bbox; const p=Math.max(w,h)*.14; return [x-p,y-p,w+2*p,h+2*p]; }

function ringSVG(size,cov,tgt,color,sub){

    <circle class="bg" cx="${cx}" cy="${cx}" r="${r.toFixed(1)}" style="stroke-width:${sw}"/>
    <circle class="fg" cx="${cx}" cy="${cx}" r="${r.toFixed(1)}" stroke="${color}" stroke-dasharray="0 ${c.toFixed(2)}" style="stroke-width:${sw};opacity:0" transform="rotate(-90 ${cx} ${cx})"/>${tk}
    <text x="${cx}" y="${sub?cx-size*.06:cx}" font-size="${(size*.27).toFixed(1)}">0%</text>${sub?`<text x="${cx}" y="${cx+size*.17}" font-size="${(size*.1).toFixed(1)}" style="font-family:var(--f-body);font-weight:500;fill:var(--ink3)">${esc(sub)}</text>`:""}</svg>`; }
function animateRings(root){

    const to=+svg.dataset.to, c=+svg.dataset.c, fg=svg.querySelector(".fg"), tx=svg.querySelector("text"); const t0=performance.now(), dur=reduce?0:850;

function orgIssues(M,s){

  if(failed.length) out.push(["var(--bad)",`${failed.length} failed, awaiting re-inspection`,failed.map(f=>esc(f.name)).join(", ")]);
  const b=yearBounds(M.Y); const wk=Math.max(1,(Date.parse(b.workEnd)-Date.parse(todayISO()))/(7*864e5));
  if(s.need>0){ const per=s.need/wk; out.push([s.behind?"var(--bad)":"var(--due)", s.behind?`Behind pace: ${pct(s.coverage)} done, ${pct(s.expected)} expected by today`:`${s.need} more inspection${s.need>1?"s":""} to reach ${pct(s.target)}`, `About ${per<1?per.toFixed(1):Math.ceil(per)} per week through ${fmtDate(b.workEnd)} keeps the district on target.`]); }
  if(s.unassigned) out.push(["var(--un)",`${s.unassigned} campus${s.unassigned>1?"es have":" has"} no rotation letter`,"Use Balance rotation on the district page to assign them."]);
  const noPin=fs.filter(f=>f.state!=="excluded"&&f.lat==null); if(noPin.length) out.push(["var(--off)",`${noPin.length} campus${noPin.length>1?"es are":" is"} not on the map`,noPin.slice(0,4).map(f=>esc(f.name)).join(", ")+(noPin.length>4?"…":"")]);
  if(!(o.contacts||[]).length) out.push(["var(--off)","No district contacts on file","Add the superintendent, CSSS member and point of contact on the district page."]);
  if(!o.assignedTo) out.push(["var(--off)","No inspector assigned","Pick an inspector under Edit district."]);
  return out;
}

const csv=rows=>rows.map(r=>r.map(x=>{ const s=String(x??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; }).join(",")).join("\r\n");
async function saveFile(filename,data){ if(!S.downloads){ flash("Downloads are not available in this view."); return; } try{ await S.downloads.save({filename,data}); }catch(e){ if(e&&e.code!=="declined") flash("The file could not be saved ("+(e.code||"error")+")."); } }
function doExport(kind){ const M=model(); const y=M.Y;
  if(kind==="summary") return saveFile(`school-inspections-summary-${y}.csv`, csv([["Type","District / operator","Assigned inspector","Active facilities","Inspected","Coverage %","Target %","Still needed","Rotation "+M.L+" done","Rotation "+M.L+" total","Failed awaiting re-inspection","Excluded (closed etc.)"],
    ...Object.values(M.orgStats).sort((a,b)=>a.org.type.localeCompare(b.org.type)||a.org.name.localeCompare(b.org.name)).map(s=>[s.org.type,s.org.name,teamName(s.org.assignedTo),s.active,s.visited,(s.coverage*100).toFixed(1),(s.target*100).toFixed(0),s.need,s.rotDone,s.rotTotal,s.failed,s.excluded])]));
  if(kind==="visits") return saveFile(`school-inspections-visits-${y}.csv`, csv([["Date","School year","Facility","District / operator","Type","Visit","Result","COI #","Method","BDA","Maps","Self eval","Inspector","Notes","Source","Voided"],
    ...M.visits.filter(v=>v.year===y).sort((a,b)=>a.date.localeCompare(b.date)).map(v=>{const f=M.byId[v.facility]; return [v.date,v.year,f?f.name:v.facility,f?f.org.name:"",f?f.type:"",v.kind,v.result,v.coi,v.method,v.bda,v.maps,v.selfEval,teamName(v.inspector),v.notes,v.source,v.voided?"yes":""];})]));
  if(kind==="facilities") return saveFile(`school-facilities-${y}.csv`, csv([["Facility","District / operator","Type","Address","Rotation","Status","State "+y,"Last inspection","Latitude","Longitude"],
    ...M.facs.sort((a,b)=>a.org.name.localeCompare(b.org.name)||a.name.localeCompare(b.name)).map(f=>[f.name,f.org.name,f.type,f.address,f.rotation,f.status||"active",STATE_LABEL[f.state],f.lastAny?f.lastAny.date:"",f.lat,f.lng])]));
  if(kind==="json") return saveFile(`school-inspections-backup-${todayISO()}.json`, JSON.stringify({exportedAt:new Date().toISOString(),orgs:S.orgs,ledgers:S.ledgers,projects:S.projects,team:S.team,settings:S.settings},null,1));
}

  if(t.closest("[data-close]")){ closeModal(); if(!t.closest("a")) return; }
  if(t.matches("[data-scrim]")){ closeModal(); return; }

  if(ms && S.ui.view==="map" && !t.closest("svg")){ selectMapOrg(ms.dataset.mapsel); return; }

  const mfl=t.closest("[data-mapfilter]"); if(mfl){ S.ui.map.filter=mfl.dataset.mapfilter; const sc=$("#mapside .scroll"), top=sc?sc.scrollTop:0; $("#mapside").innerHTML=mapSide(model(),S.ui.map.sel); animateRings($("#mapside")); if($("#mapside .scroll")) $("#mapside .scroll").scrollTop=top; drawPins(); return; }
  const z=t.closest("[data-zoom]"); if(z){ zoomAt(+z.dataset.zoom); return; }
  const per=t.closest("[data-period]"); if(per){ S.ui.team.period=per.dataset.period; render(); return; }
  const dt=t.closest("[data-dtab]"); if(dt){ S.ui.data.tab=dt.dataset.dtab; render(); return; }
  const pc=t.closest("[data-project]:not([data-act])"); if(pc){ openProject(pc.dataset.project); return; }
  const opt=t.closest("[data-pickfac]"); if(opt){ const id=opt.dataset.pickfac; if(opt.dataset.row!=null){ IMP.matches[+opt.dataset.row]=model().byId[id]; closeModal(); render(); return; } $("#lv-facwrap").innerHTML=facCombo(id); return; }
  const a=t.closest("[data-act]");
  if(a){ const act=a.dataset.act, M=model();

      case "imp-reset": IMP.rows=null; IMP.matches=[]; render(); return;
      case "imp-pick": { const row=+a.dataset.row; openModal(`<div class="mh"><h2>Choose facility for row ${row+1}</h2><button class="btn sm ghost" data-close="1" type="button">✕</button></div><div class="mb"><div class="combo"><input type="search" id="imp-q" placeholder="Search facilities" data-row="${row}" style="width:100%"><div class="opts" id="imp-opts" style="position:static;max-height:340px"></div></div></div>`); return; }
      case "imp-commit": { const list=[]; const seen=new Set(M.visits.map(v=>v.facility+"|"+v.date+"|"+v.kind));
        IMP.prepared.filter(r=>r.f&&r.date).forEach(r=>{ const k=r.f.id+"|"+r.date+"|"+r.kind; if(seen.has(k)) return; seen.add(k);
          const rec={facility:r.f.id,date:r.date,kind:r.kind,result:r.result,coi:r.coi||undefined,inspector:r.inspector||r.f.org.assignedTo||undefined,inspectorAssumed:!r.inspector||undefined,notes:r.notes||undefined,source:"import: "+(IMP.fileName||"pasted CSV"),loggedBy:S.me.id||undefined,loggedAt:new Date().toISOString()};
          Object.keys(rec).forEach(k=>rec[k]===undefined&&delete rec[k]); list.push({orgId:r.f.orgId,year:yearOf(r.date),vid:uid("i"),rec}); });
        if(!list.length){ flash("Every ready row is already on file."); return; }
        if(await write(()=>saveVisits(list),`Imported ${list.length} visits`).catch(()=>false)){ IMP.rows=null; render(); } return; }
      case "inbox-approve": { const x=S.inbox[a.dataset.item]; const p=x.payload||{};
        if(x.kind==="visit"){ const f=matchFacility(M,p.facilityName||"",p.orgName||""); const d=normDate(p.date); if(!f||!d){ flash("This item needs a facility match and a date."); return; }
          const rec={facility:f.id,date:d,kind:normKind(p.kind),result:normResult(p.result),coi:p.coi||undefined,inspector:teamIdFor(p.inspector)||f.org.assignedTo||undefined,notes:p.notes||undefined,source:"plugin: "+(x.source||"inbox"),loggedBy:S.me.id||undefined,loggedAt:new Date().toISOString()};
          Object.keys(rec).forEach(k=>rec[k]===undefined&&delete rec[k]);
          if(await write(()=>upsertLedger(f.orgId,yearOf(d),uid("p"),rec).then(()=>S.db.doc("inbox/"+a.dataset.item).delete()),"Visit added from inbox").catch(()=>false)) return; }
        else if(x.kind==="facility"){ const oe=Object.entries(S.orgs).find(([,o])=>o.name.toLowerCase()===String(p.orgName||"").toLowerCase()); if(!oe){ flash("No district named "+(p.orgName||"")+". Add it first."); return; }
          await write(()=>patchFacility(oe[0],slug(oe[1].name).slice(0,20)+"--"+slug(p.name||"facility"),{name:p.name,address:p.address||"",rotation:p.rotation||null,status:p.status||"active",origin:"plugin: "+(x.source||"inbox")}).then(()=>S.db.doc("inbox/"+a.dataset.item).delete()),"Facility added"); }
        else if(x.kind==="project"){ const oe=Object.entries(S.orgs).find(([,o])=>o.name.toLowerCase()===String(p.orgName||"").toLowerCase());
          await write(()=>S.db.doc("projects/"+uid("prj-")).set({name:p.name||"Project",org:oe?oe[0]:null,kind:p.kind||"New construction",phase:p.phase||"Plan review",permit:p.permit||"",target:p.target||null,notes:"From "+(x.source||"inbox")}).then(()=>S.db.doc("inbox/"+a.dataset.item).delete()),"Project added"); }
        return; }
      case "inbox-dismiss": await write(()=>S.db.doc("inbox/"+a.dataset.item).delete(),"Dismissed"); return;
    }
  }
  const orgEl=t.closest("[data-org]"); if(orgEl && !t.closest("button[data-act]")){ location.hash="org-"+orgEl.dataset.org; return; }
  const fr=t.closest("tr[data-fac],.qrow[data-fac]"); if(fr){ openFacility(fr.dataset.fac); return; }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="dirq"){ S.ui.dir.q=t.value; const pos=t.selectionStart; render(); const n=$("#dirq"); n.focus(); n.setSelectionRange(pos,pos); }
  if(t.id==="exq"||t.id==="exdq"){ const k=t.id==="exq"?"q":"dq"; exState()[k]=t.value; persistUI(); const pos=t.selectionStart; render(); const n=$("#"+t.id); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
  if(t.id==="facq"){ S.ui.fac.q=t.value; const pos=t.selectionStart; render(); const n=$("#facq"); n.focus(); n.setSelectionRange(pos,pos); }
  if(t.id==="lv-facq"||t.id==="imp-q"){ const M=model(); const q=t.value.toLowerCase().trim(); const box=$(t.id==="imp-q"?"#imp-opts":"#lv-opts");
    if(!q){ box.hidden=t.id!=="imp-q"; box.innerHTML=""; return; }
    const res=M.facs.filter(f=>f.state!=="excluded"&&(f.name+" "+f.org.name).toLowerCase().includes(q)).slice(0,12);
    box.hidden=false; box.innerHTML=res.map(f=>`<div class="opt" data-pickfac="${esc(f.id)}" ${t.dataset.row!=null?`data-row="${t.dataset.row}"`:""}><span>${esc(f.name)}</span><span class="faint">${esc(f.org.name)}</span></div>`).join("")||`<div class="opt faint">No match</div>`; }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.id==="yearsel"){ S.ui.year=t.value===yearOf(todayISO())?null:t.value; bump(); render(); }
  if(t.id==="factype"){ S.ui.fac.type=t.value; render(); }
  if(t.dataset.exorg){ exToggle("orgs",t.dataset.exorg); }
  if(t.id==="exgroup"){ exSet({group:t.value}); } if(t.id==="exsort"){ exSet({sort:t.value}); }
  if(t.dataset.ins){ S.ui.ins[t.dataset.ins]=t.type==="number"?+t.value:t.value; render(); }
  if(t.dataset.layer){ S.ui.map.layers[t.dataset.layer]=t.checked; persistUI(); if(t.dataset.layer==="roads"){ const g=$("#g-roads"); if(g) g.hidden=!t.checked; } rescale(); }
  if(t.dataset.impmap){ IMP.map[t.dataset.impmap]=t.value===""?null:+t.value; IMP.matches=[]; render(); }
});
document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.matches(".pcard")){ e.preventDefault(); openProject(e.target.dataset.project); } });
$("#logbtn").addEventListener("click",()=>openLog(null));
window.addEventListener("resize",()=>{ if(S.ui.view==="map") rescale(); });
document.addEventListener("mouseover", e=>{
  if(S.ui.view!=="map"||!MAPSTATE) return; const side=e.target.closest("#mapside"); if(!side) return;
  const h=e.target.closest("[data-hover-isd]"); liftDistrict(h?h.dataset.hoverIsd:null);
  const fr=e.target.closest(".frow[data-mapfac]"); const id=fr?fr.dataset.mapfac:null; if(S.ui.map.hoverPin!==id){ S.ui.map.hoverPin=id; const prev=S.ui.map.hot; S.ui.map.hot=id||S.ui.map.hotLocked||null; if(prev!==S.ui.map.hot) drawPins(); }
});
boot();
</script>
